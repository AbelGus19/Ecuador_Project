version: '3.8'

services:
  mongo-db:
    image: mongo:latest
    container_name: mongo-db
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  product-service:
    image: abelgus19/product-service:latest
    container_name: product-service
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - MONGO_URI=mongodb://mongo-db:27017/products-db
    depends_on:
      - mongo-db
    restart: unless-stopped

  category-service:
    build: ./microservices/category-service
    container_name: category-service
    ports:
      - "3002:3002"
    env_file:
      - ./microservices/category-service/.env
    depends_on:
      - mongo-db
    restart: unless-stopped

  nginx:
    image: nginx:latest
    container_name: nginx-gateway
    ports:
      - "80:80"
    volumes:
      - ./microservices/api-gateway/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - product-service
      - category-service
    restart: unless-stopped

  user-profile-service:
    image: abelgus19/user-profile-service:latest
    ports:
      - "8081:8081"
    env_file:
      - ./microservices/user-profile-service/.env 


volumes:
  mongo-data:
